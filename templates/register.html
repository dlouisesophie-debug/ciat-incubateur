{% extends 'base.html' %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h1>Créer un compte porteur de projet</h1>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
    <label for="name">Nom complet</label><input id="name" name="name" type="text" required value="{{ form.get('name','') }}">
    <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" required value="{{ form.get('email','') }}" autocomplete="username">
    <label for="phone">Téléphone</label><input id="phone" name="phone" type="text" value="{{ form.get('phone','') }}">
    <label for="organisation">Organisation / filière</label><input id="organisation" name="organisation" type="text" value="{{ form.get('organisation','') }}">
    <label for="password">Mot de passe (8 caractères minimum)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <label for="password2">Confirmer le mot de passe</label><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password">
    <p><button class="btn" type="submit">Créer mon compte</button></p>
  </form>
  <p class="small muted">Les comptes membres du comité, mentors et coordonnateurs sont créés par le coordonnateur du CIAT.</p>
</div>
{% endblock %}
